[project]
name = "pier-ds-utils"
version = "0.7.0a2"
description = "A library for data science teams to avoid code duplication in common tasks involving scikit-learn transformers and estimators."
authors = [{ name = "Gabriel Guarisa", email = "gabriel.guarisa@pier.digital" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "setuptools>=69.0.3,<70",
    "scikit-learn",
    "pandas",
    "statsmodels",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4,<8",
    "boto3>=1.34.19,<2",
    "awswrangler>=3.5.1,<4",
    "ruff>=0.2.0,<0.3",
    "pytest-cov>=6.0.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
